[project]
name = "matibhrom"
version = "0.1.0"
description = "Bengali LLM Hallucination Experiment Platform"
authors = [
    {name = "Akib Hasan", email = "akib@example.com"},
    {name = "Jaef", email = "jaef@example.com"},
    {name = "Sabit", email = "sabit@example.com"},
]
dependencies = [
    "pydantic>=2.6,<3",
    "omegaconf>=2.3,<3",
    "pyyaml>=6.0,<7",
    "litellm>=1.40,<2",
    "transformers>=4.44,<5",
    "torch>=2.3,<3",
    "sentence-transformers>=3.0,<4",
    "faiss-cpu>=1.8,<2",
    "streamlit>=1.36,<2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
gpu = [
    "vllm==0.6.3.post1",
    "faiss-gpu>=1.8,<2",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<1",
]

[project.scripts]
matibhrom-run = "src.runner.run:main"
matibhrom-validate = "src.validate_data:main"
matibhrom-build-index = "scripts.build_index:main"
matibhrom-check-budget = "scripts.check_budget:main"
matibhrom-make-splits = "scripts.make_splits:main"
matibhrom-export-tables = "scripts.export_tables:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-fail-under=80",
    "--verbose",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.py$"
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
select = ["E", "F", "W", "C90"]
ignore = []
line-length = 88
target-version = "py311"